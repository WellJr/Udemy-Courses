# Configurações do multiplos bancos fica em DataSourceConfig.java

# BD Spring Batch
spring.datasource.jdbcUrl=jdbc:postgresql://localhost:5432/spring-batch
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# BD aplicação
app.datasource.jdbcUrl=jdbc:postgresql://localhost:5432/app
app.datasource.username=postgres
app.datasource.password=postgres
app.datasource.driver-class-name=org.postgresql.Driver


spring.batch.initialize-schema=always

logging.level.org.springframework.jdbc.core=DEBUG